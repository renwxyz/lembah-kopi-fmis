# ==============================================================================
# NGINX PRODUCTION CONFIGURATION - LEMBAH KOPI
# ==============================================================================
# Petunjuk:
# 1. Pastikan certbot telah meng-generate SSL certificate Let's Encrypt:
#    certbot certonly --standalone -d api.lembahkopi.id -d admin.lembahkopi.id -d lembahkopi.id -d www.lembahkopi.id -d cdn.lembahkopi.id
# 2. Atau pasang di container Nginx reverse proxy.
# ==============================================================================

# Common SSL parameters
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.lembahkopi.id admin.lembahkopi.id lembahkopi.id www.lembahkopi.id cdn.lembahkopi.id;
    return 301 https://$host$request_uri;
}

# 1. API BACKEND (core-system)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.lembahkopi.id;

    ssl_certificate /etc/letsencrypt/live/lembahkopi.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lembahkopi.id/privkey.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass http://core-system:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. WEB DASHBOARD ADMIN (Next.js)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lembahkopi.id;

    ssl_certificate /etc/letsencrypt/live/lembahkopi.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lembahkopi.id/privkey.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass http://web-dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. COMMUNITY PROFILE (Next.js)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lembahkopi.id www.lembahkopi.id;

    ssl_certificate /etc/letsencrypt/live/lembahkopi.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lembahkopi.id/privkey.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass http://web-compro:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. CDN STORAGE (MinIO)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.lembahkopi.id;

    ssl_certificate /etc/letsencrypt/live/lembahkopi.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lembahkopi.id/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

