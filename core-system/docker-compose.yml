services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: lembah_kopi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lembah_kopi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_core:/var/lib/postgresql/data
      - ../docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./migrations:/docker-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lembah_kopi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lembah_kopi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lembahkopi
      MINIO_ROOT_PASSWORD: lembahkopi-minio-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_core:
  miniodata:
