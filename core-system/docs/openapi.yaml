          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Pascapanen]
      operationId: deleteProcessingBatch
      summary: Hapus batch dan alokasi terkait
      responses:
        "204":
          description: Batch berhasil dihapus. Status alokasi panen dihitung ulang.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/batch/{id}/tahap:
    parameters:
      - $ref: "#/components/parameters/BatchID"
    get:
      tags: [Pascapanen]
      operationId: listProcessingBatchStages
      summary: Histori tahap dan kadar air batch
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Histori terbaru lebih dahulu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ProcessingStagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Pascapanen]
      operationId: recordProcessingBatchStage
      summary: Catat perubahan tahap atau pengukuran kadar air
      description: Untuk status SELESAI, berat green bean harus sudah dicatat pada batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingStageRequest"
      responses:
        "201":
          description: Histori tahap berhasil dicatat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ProcessingStage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/batch/{id}/panen:
    parameters:
      - $ref: "#/components/parameters/BatchID"
    get:
      tags: [Pascapanen]
      operationId: listBatchHarvestAllocations
      summary: Daftar alokasi panen batch
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Alokasi panen batch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/BatchHarvestMappingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Pascapanen]
      operationId: allocateHarvestToBatch
      summary: Alokasikan berat panen ke batch
      description: Total alokasi lintas batch tidak boleh melampaui berat panen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchHarvestCreateRequest"
      responses:
        "201":
          description: Alokasi berhasil dicatat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/BatchHarvestMapping"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/batch/{id}/panen/{mapping_id}:
    parameters:
      - $ref: "#/components/parameters/BatchID"
      - name: mapping_id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    put:
      tags: [Pascapanen]
      operationId: updateBatchHarvestAllocation
      summary: Koreksi berat alokasi panen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchHarvestUpdateRequest"
      responses:
        "200":
          description: Alokasi berhasil diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/BatchHarvestMapping"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Pascapanen]
      operationId: removeBatchHarvestAllocation
      summary: Hapus alokasi panen
      responses:
        "204":
          description: Alokasi berhasil dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/batch/{id}/traceability:
    parameters:
      - $ref: "#/components/parameters/BatchID"
    get:
      tags: [Pascapanen]
      operationId: getBatchTraceability
      summary: Telusuri asal batch hingga lahan dan histori tanah
      responses:
        "200":
          description: Batch dan sumber panen yang dialokasikan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/BatchTraceability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PetaniID:
      name: id
      in: path
      required: true
      description: ID petani.
      schema:
        type: string
        minLength: 1
    LahanID:
      name: id
      in: path
      required: true
      description: ID lahan.
      schema:
        type: string
        minLength: 1
    InventarisID:
      name: id
      in: path
      required: true
      description: ID inventaris tanaman.
      schema:
        type: string
        minLength: 1
    SoilLogID:
      name: id
      in: path
      required: true
      description: ID log kondisi tanah.
      schema:
        type: string
        minLength: 1
    FertilizationID:
      name: id
      in: path
      required: true
      description: ID aplikasi pemupukan.
      schema:
        type: string
        minLength: 1
    IncidentID:
      name: id
      in: path
      required: true
      description: ID insiden hama atau penyakit.
      schema:
        type: string
        minLength: 1
    HarvestID:
      name: id
      in: path
      required: true
      description: ID catatan panen.
      schema:
        type: string
        minLength: 1
    BatchID:
      name: id
      in: path
      required: true
      description: ID batch pascaproses.
      schema:
        type: string
        minLength: 1
    Search:
      name: search
      in: query
      description: Kata kunci pencarian.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Nomor halaman, dimulai dari 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Jumlah item per halaman.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    InvalidRequest:
      description: Request tidak valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Autentikasi diperlukan atau token tidak valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Pengguna tidak memiliki izin untuk operasi ini.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Operasi bertentangan dengan kondisi resource saat ini.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Terjadi kesalahan internal.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: Problem Details sesuai RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI yang mengidentifikasi jenis masalah.
        title:
          type: string
          description: Ringkasan singkat jenis masalah.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Kode status HTTP.
        detail:
          type: string
          description: Penjelasan masalah untuk kejadian ini.
        instance:
          type: string
          description: URI path request yang mengalami masalah.
      additionalProperties: true
      example:
        type: https://api.lembahkopi.id/problems/invalid-request
        title: Invalid request
        status: 400
        detail: Request body must contain valid JSON.
        instance: /api/v1/petani
    SuccessMetadata:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username_or_email, password]
      properties:
        username_or_email:
          type: string
          minLength: 1
          example: admin_kelompok
        password:
          type: string
          format: password
          minLength: 1
          example: replace-with-a-strong-password
    LoginData:
      type: object
      required: [token_type, access_token, expires_at, user]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/Admin"
    Admin:
      type: object
      required: [id_admin, username, email, nama_lengkap, role, status_aktif, last_login_at, created_at, updated_at]
      properties:
        id_admin:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        nama_lengkap:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN_KELOMPOK_TANI]
        status_aktif:
          type: boolean
        last_login_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [password_lama, password_baru, konfirmasi_password_baru]
      properties:
        password_lama:
          type: string
          format: password
          minLength: 1
        password_baru:
          type: string
          format: password
          description: Minimal 12 karakter; maksimal 72 byte UTF-8 karena menggunakan bcrypt.
          minLength: 12
        konfirmasi_password_baru:
          type: string
          format: password
          minLength: 12
    CreateAdminRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, nama_lengkap, role]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 12
          description: Maksimal 72 byte UTF-8 karena menggunakan bcrypt.
          example: replace-with-a-strong-password
        nama_lengkap:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN_KELOMPOK_TANI]
    PetaniRequest:
      type: object
      additionalProperties: false
      required: [nama_lengkap, no_hp]
      properties:
        nama_lengkap:
          type: string
          minLength: 1
          maxLength: 100
        no_hp:
          type: string
          minLength: 1
          maxLength: 15
    Petani:
      type: object
      required: [id_petani, nama_lengkap, no_hp, created_at, updated_at]
      properties:
        id_petani:
          type: string
        nama_lengkap:
          type: string
        no_hp:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PetaniPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Petani"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    LahanRequest:
      type: object
      additionalProperties: false
      required: [id_petani, nama_petak, dusun]
      properties:
        id_petani:
          type: string
          minLength: 1
        nama_petak:
          type: string
          minLength: 1
          maxLength: 50
        dusun:
          type: string
          minLength: 1
          maxLength: 50
        elevasi_mdpl:
          type: integer
          minimum: 0
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    Lahan:
      type: object
      required: [id_lahan, id_petani, nama_petak, dusun]
      properties:
        id_lahan:
          type: string
        id_petani:
          type: string
        nama_petak:
          type: string
        dusun:
          type: string
        elevasi_mdpl:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        polygon_geom:
          $ref: "#/components/schemas/Polygon"
        luas_m2:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LahanPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lahan"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    PolygonRequest:
      type: object
      additionalProperties: false
      required: [polygon_geom]
      properties:
        polygon_geom:
          $ref: "#/components/schemas/Polygon"
    Polygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    InventarisRequest:
      type: object
      additionalProperties: false
      required: [varietas, kelompok_usia]
      properties:
        varietas:
          type: string
          enum: [ROBUSTA, ARABIKA]
        kelompok_usia:
          type: string
          enum: [LIMA_TAHUN_KURANG, LIMA_BELAS_TAHUN_KURANG, LIMA_BELAS_TAHUN_LEBIH]
    Inventaris:
      type: object
      required: [id_inventaris, id_lahan, varietas, kelompok_usia, jumlah_pohon]
      properties:
        id_inventaris:
          type: string
        id_lahan:
          type: string
        varietas:
          type: string
          enum: [ROBUSTA, ARABIKA]
        kelompok_usia:
          type: string
          enum: [LIMA_TAHUN_KURANG, LIMA_BELAS_TAHUN_KURANG, LIMA_BELAS_TAHUN_LEBIH]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PopulasiPohonRequest:
      type: object
      additionalProperties: false
      required: [jumlah_pohon]
      properties:
        jumlah_pohon:
          type: integer
          minimum: 0
    PopulasiPohonItem:
      type: object
      required: [id_inventaris, varietas, kelompok_usia, jumlah_pohon]
      properties:
        id_inventaris:
          type: string
        varietas:
          type: string
          enum: [ROBUSTA, ARABIKA]
        kelompok_usia:
          type: string
          enum: [LIMA_TAHUN_KURANG, LIMA_BELAS_TAHUN_KURANG, LIMA_BELAS_TAHUN_LEBIH]
        jumlah_pohon:
          type: integer
          minimum: 0
    PopulasiPohon:
      type: object
      required: [id_lahan, total_pohon, blok]
      properties:
        id_lahan:
          type: string
        total_pohon:
          type: integer
          minimum: 0
        blok:
          type: array
          items:
            $ref: "#/components/schemas/PopulasiPohonItem"
    SoilConditionRequest:
      type: object
      additionalProperties: false
      properties:
        id_pemupukan:
          type: string
          description: Isi bersama tahap_pemantauan untuk mengaitkan sampling dengan aplikasi.
        tahap_pemantauan:
          type: string
          enum: [SEBELUM, SESUDAH]
        tanggal_ukur:
          type: string
          format: date-time
          description: Default waktu server saat tidak dikirim.
        ph_tanah:
          type: number
          minimum: 0
          maximum: 14
          multipleOf: 0.1
          nullable: true
        kelembapan:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          nullable: true
        suhu_celsius:
          type: number
          minimum: -999.9
          maximum: 999.9
          multipleOf: 0.1
          nullable: true
        n_value:
          type: integer
          minimum: 0
          nullable: true
        p_value:
          type: integer
          minimum: 0
          nullable: true
        k_value:
          type: integer
          minimum: 0
          nullable: true
        ec_value:
          type: integer
          minimum: 0
          nullable: true
    SoilConditionLog:
      type: object
      required: [id_log_tanah, id_lahan, tanggal_ukur, ph_tanah, kelembapan, suhu_celsius, n_value, p_value, k_value, ec_value, created_at]
      properties:
        id_log_tanah:
          type: string
        id_lahan:
          type: string
        id_pemupukan:
          type: string
          nullable: true
        tahap_pemantauan:
          type: string
          enum: [SEBELUM, SESUDAH]
          nullable: true
        tanggal_ukur:
          type: string
          format: date-time
        ph_tanah:
          type: number
          nullable: true
        kelembapan:
          type: number
          nullable: true
        suhu_celsius:
          type: number
          nullable: true
        n_value:
          type: integer
          nullable: true
        p_value:
          type: integer
          nullable: true
        k_value:
          type: integer
          nullable: true
        ec_value:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    SoilConditionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SoilConditionLog"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    FertilizationRequest:
      type: object
      additionalProperties: false
      required: [tanggal_aplikasi, jenis_pupuk, dosis_kg]
      properties:
        tanggal_aplikasi:
          type: string
          format: date
        jenis_pupuk:
          type: string
          minLength: 1
          maxLength: 100
        dosis_kg:
          type: number
          minimum: 0
          maximum: 999999.99
          multipleOf: 0.01
    Fertilization:
      type: object
      required: [id_pemupukan, id_lahan, tanggal_aplikasi, jenis_pupuk, dosis_kg, created_at, updated_at]
      properties:
        id_pemupukan:
          type: string
        id_lahan:
          type: string
        tanggal_aplikasi:
          type: string
          format: date
        jenis_pupuk:
          type: string
        dosis_kg:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FertilizationPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fertilization"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    IncidentRequest:
      type: object
      additionalProperties: false
      required: [tanggal_ditemukan, jenis_hama_penyakit, tingkat_serangan]
      properties:
        tanggal_ditemukan:
          type: string
          format: date
        jenis_hama_penyakit:
          type: string
          minLength: 1
          maxLength: 100
        tingkat_serangan:
          type: string
          enum: [RINGAN, SEDANG, BERAT]
    Incident:
      type: object
      required: [id_insiden, id_lahan, tanggal_ditemukan, jenis_hama_penyakit, tingkat_serangan, status_penanganan]
      properties:
        id_insiden:
          type: string
        id_lahan:
          type: string
        tanggal_ditemukan:
          type: string
          format: date
        jenis_hama_penyakit:
          type: string
        tingkat_serangan:
          type: string
          enum: [RINGAN, SEDANG, BERAT]
        status_penanganan:
          type: string
          enum: [TERDETEKSI, DALAM_PENANGANAN, TERKENDALI]
        penanganan_terakhir:
          $ref: "#/components/schemas/Treatment"
        created_at:
