openapi: 3.0.3
info:
  title: Lembah Kopi API
  version: 1.0.0
  description: |
    Kontrak HTTP untuk pengelolaan petani, lahan, inventaris, monitoring agronomi,
    panen, dan proses pascapanen.
servers:
  - url: /
    description: Server yang sedang membuka dokumentasi ini
tags:
  - name: Auth
    description: Autentikasi dan profil pengguna aktif
  - name: Admin Management
    description: Pengelolaan akun admin
  - name: Petani
    description: Data identitas petani
  - name: Lahan
    description: Data lahan dan pemiliknya
  - name: Pemetaan Polygon (GIS)
    description: Geometri spasial lahan
  - name: Inventaris Tanaman
    description: Blok inventaris tanaman pada lahan
  - name: Populasi Pohon
    description: Jumlah pohon per blok inventaris dan lahan
  - name: Kondisi Tanah
    description: Sampling parameter tanah dan histori pengukuran
  - name: Pemupukan
    description: Riwayat aplikasi pemupukan yang sudah dilaksanakan
  - name: Hama & Penyakit
    description: Insiden tanaman dan histori tindakan penanganan
  - name: Panen
    description: Pencatatan hasil panen kopi per lahan dan inventaris tanaman
  - name: Pascapanen
    description: Katalog metode, batch pengolahan, histori tahap, dan traceability
  - name: Dashboard
    description: Ringkasan operasional dan data spasial dasbor
security:
  - BearerAuth: []
paths:
  /api/v1/dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getDashboardOverview
      summary: Ringkasan operasional dasbor
      description: Mengambil agregasi KPI, data poligon lahan untuk peta GIS, batch aktif, insiden kebun, dan panen terbaru.
      responses:
        "200":
          description: Ringkasan dasbor berhasil diambil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autentikasi pengguna
      description: Memverifikasi kredensial dan memberikan access token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username_or_email: admin_kelompok
              password: "<password>"
      responses:
        "200":
          description: Autentikasi berhasil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginData"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Ambil profil pengguna aktif
      responses:
        "200":
          description: Profil pengguna.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/password:
    put:
      tags: [Auth]
      operationId: changeCurrentUserPassword
      summary: Ubah password pengguna aktif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMetadata"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin:
    post:
      tags: [Admin Management]
      operationId: createAdmin
      summary: Buat akun admin
      description: Hanya dapat dilakukan oleh Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Akun admin berhasil dibuat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/petani:
    get:
      tags: [Petani]
      operationId: listFarmers
      summary: Daftar petani
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Daftar petani dengan metadata pagination.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/PetaniPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Petani]
      operationId: createFarmer
      summary: Tambah petani
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetaniRequest"
      responses:
        "201":
          description: Petani berhasil ditambahkan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Petani"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/petani/{id}:
    parameters:
      - $ref: "#/components/parameters/PetaniID"
    get:
      tags: [Petani]
      operationId: getFarmer
      summary: Ambil detail petani
      responses:
        "200":
          description: Detail petani.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Petani"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Petani]
      operationId: updateFarmer
      summary: Perbarui data petani
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetaniRequest"
      responses:
        "200":
          description: Petani berhasil diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Petani"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Petani]
      operationId: deleteFarmer
      summary: Hapus petani
      responses:
        "204":
          description: Petani berhasil dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan:
    get:
      tags: [Lahan]
      operationId: listLand
      summary: Daftar lahan
      parameters:
        - name: id_petani
          in: query
          description: Filter berdasarkan ID petani.
          schema:
            type: string
        - name: farmer_id
          in: query
          deprecated: true
          description: Alias dari id_petani (dipertahankan untuk kompatibilitas).
          schema:
            type: string
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Daftar lahan dengan metadata pagination.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/LahanPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Lahan]
      operationId: createLand
      summary: Daftarkan lahan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LahanRequest"
      responses:
        "201":
          description: Lahan berhasil didaftarkan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Lahan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan/{id}:
    parameters:
      - $ref: "#/components/parameters/LahanID"
    get:
      tags: [Lahan]
      operationId: getLand
      summary: Ambil detail lahan
      responses:
        "200":
          description: Detail lahan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Lahan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Lahan]
      operationId: updateLand
      summary: Perbarui data lahan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LahanRequest"
      responses:
        "200":
          description: Lahan berhasil diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Lahan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Lahan]
      operationId: deleteLand
      summary: Hapus lahan
      description: Inventaris tanaman yang dimiliki lahan ikut terhapus.
      responses:
        "204":
          description: Lahan berhasil dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan/{id}/polygon:
    parameters:
      - $ref: "#/components/parameters/LahanID"
    put:
      tags: [Pemetaan Polygon (GIS)]
      operationId: setLandPolygon
      summary: Simpan polygon lahan
      description: Polygon harus valid dan tidak tumpang tindih dengan polygon lahan lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolygonRequest"
      responses:
        "200":
          description: Polygon berhasil disimpan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Lahan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Pemetaan Polygon (GIS)]
      operationId: deleteLandPolygon
      summary: Hapus polygon lahan
      responses:
        "204":
          description: Polygon berhasil dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan/{id}/inventaris:
    parameters:
      - $ref: "#/components/parameters/LahanID"
    get:
      tags: [Inventaris Tanaman]
      operationId: listLandInventory
      summary: Daftar inventaris tanaman pada lahan
      responses:
        "200":
          description: Daftar blok inventaris lahan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Inventaris"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Inventaris Tanaman]
      operationId: createLandInventory
      summary: Tambah inventaris tanaman pada lahan
      description: ID lahan hanya ditentukan oleh parameter path dan tidak dikirimkan dalam body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventarisRequest"
      responses:
        "201":
          description: Inventaris berhasil ditambahkan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Inventaris"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/inventaris/{id}:
    parameters:
      - $ref: "#/components/parameters/InventarisID"
    get:
      tags: [Inventaris Tanaman]
      operationId: getInventory
      summary: Ambil detail inventaris tanaman
      responses:
        "200":
          description: Detail inventaris tanaman.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Inventaris"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Inventaris Tanaman]
      operationId: updateInventory
      summary: Perbarui inventaris tanaman
      description: Lahan relasi inventaris tidak dapat diubah melalui operasi ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventarisRequest"
      responses:
        "200":
          description: Inventaris berhasil diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Inventaris"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Inventaris Tanaman]
      operationId: deleteInventory
      summary: Hapus inventaris tanaman
      responses:
        "204":
          description: Inventaris berhasil dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan/{id}/populasi-pohon:
    parameters:
      - $ref: "#/components/parameters/LahanID"
    get:
      tags: [Populasi Pohon]
      operationId: getLandTreePopulation
      summary: Ambil populasi pohon pada lahan
      responses:
        "200":
          description: Populasi pohon per blok serta total lahan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/PopulasiPohon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/inventaris/{id}/populasi-pohon:
    parameters:
      - $ref: "#/components/parameters/InventarisID"
    put:
      tags: [Populasi Pohon]
      operationId: setInventoryTreePopulation
      summary: Perbarui populasi pohon pada blok
      description: Perubahan jumlah pohon dan total populasi lahan dilakukan secara transaksional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulasiPohonRequest"
      responses:
        "200":
          description: Populasi pohon blok berhasil diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/PopulasiPohonItem"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/lahan/{id}/kondisi-tanah:
    parameters:
      - $ref: "#/components/parameters/LahanID"
    get:
      tags: [Kondisi Tanah]
      operationId: listSoilConditionLogs
      summary: Ambil histori pengukuran tanah
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: id_pemupukan
          in: query
          description: Filter log yang dikaitkan dengan aplikasi pemupukan.
          schema:
            type: string
        - name: tahap_pemantauan
          in: query
          description: Wajib disertai id_pemupukan bila digunakan.
          schema:
            type: string
            enum: [SEBELUM, SESUDAH]
        - name: dari
          in: query
          description: Batas waktu awal RFC 3339, inklusif.
          schema:
            type: string
            format: date-time
        - name: sampai
          in: query
          description: Batas waktu akhir RFC 3339, inklusif.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Histori berurutan terbaru lebih dahulu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SoilConditionPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Kondisi Tanah]
      operationId: createSoilConditionLog
      summary: Catat hasil sampling tanah
      description: Parameter yang tidak tersedia dari alat dapat dikirim null atau tidak disertakan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoilConditionRequest"
      responses:
        "201":
          description: Sampling tanah berhasil dicatat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMetadata"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SoilConditionLog"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/kondisi-tanah/{id}:
    get:
      tags: [Kondisi Tanah]
      operationId: getSoilConditionLog
